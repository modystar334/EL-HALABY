<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>هريسة الحلبي | منذ 1909</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:"Cairo",sans-serif;
  background:#100a06;
  color:#f7ecdf;
}

button,input,textarea,select{
  font-family:inherit;
}

button{
  cursor:pointer;
}

img{
  display:block;
  max-width:100%;
}

/* ================= HEADER ================= */

header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(16,10,6,.92);
  backdrop-filter:blur(15px);
  border-bottom:1px solid rgba(214,168,73,.2);
}

.navbar{
  max-width:1250px;
  margin:auto;
  padding:13px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo-circle{
  width:50px;
  height:50px;
  border-radius:50%;
  border:2px solid #d6a849;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#d6a849;
  font-family:"Playfair Display",serif;
  font-weight:800;
  font-size:15px;
}

.logo h1{
  font-family:"Playfair Display",serif;
  color:#e3bb64;
  font-size:21px;
}

.logo span{
  color:#9e8c78;
  font-size:11px;
}

.cart-btn{
  border:1px solid #a8792b;
  background:#21140c;
  color:#f3dfbd;
  padding:9px 15px;
  border-radius:30px;
  display:flex;
  align-items:center;
  gap:8px;
  font-weight:800;
}

.cart-count{
  width:24px;
  height:24px;
  border-radius:50%;
  background:#d6a849;
  color:#160d07;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
}

/* ================= HERO ================= */

.hero{
  min-height:650px;
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:80px 20px;
  background:
    linear-gradient(
      rgba(16,9,5,.35),
      rgba(16,9,5,.92)
    ),
    radial-gradient(
      circle at 50% 35%,
      rgba(214,168,73,.22),
      transparent 40%
    );
}

.hero::before{
  content:"";
  position:absolute;
  width:600px;
  height:600px;
  border-radius:50%;
  border:1px solid rgba(214,168,73,.13);
  box-shadow:
    0 0 80px rgba(214,168,73,.08),
    inset 0 0 80px rgba(214,168,73,.05);
  animation:heroRotate 15s linear infinite;
}

.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 20% 30%,rgba(214,168,73,.08),transparent 25%),
    radial-gradient(circle at 80% 70%,rgba(139,76,27,.10),transparent 25%);
  pointer-events:none;
}

@keyframes heroRotate{
  from{
    transform:rotate(0deg) scale(1);
  }
  50%{
    transform:rotate(180deg) scale(1.05);
  }
  to{
    transform:rotate(360deg) scale(1);
  }
}

.hero-content{
  position:relative;
  z-index:3;
  max-width:900px;
}

.hero-small{
  color:#d6a849;
  font-size:14px;
  letter-spacing:4px;
  margin-bottom:18px;
}

.hero h2{
  font-family:"Playfair Display",serif;
  font-size:clamp(55px,9vw,105px);
  line-height:.95;
  color:#f0ca76;
  text-shadow:
    0 5px 35px rgba(214,168,73,.18);
  margin-bottom:20px;
}

.hero-line{
  width:100px;
  height:2px;
  background:#d6a849;
  margin:0 auto 22px;
}

.hero p{
  max-width:650px;
  margin:auto;
  color:#d2c0aa;
  font-size:17px;
  line-height:2;
}

.hero-btn{
  margin-top:30px;
  padding:15px 35px;
  border:none;
  border-radius:40px;
  background:linear-gradient(135deg,#e1b75c,#a87320);
  color:#1a0e06;
  font-weight:900;
  font-size:16px;
  box-shadow:0 12px 35px rgba(214,168,73,.15);
  transition:.3s;
}

.hero-btn:hover{
  transform:translateY(-5px);
  box-shadow:0 18px 45px rgba(214,168,73,.25);
}

/* ================= MENU ================= */

.menu{
  max-width:1250px;
  margin:auto;
  padding:60px 20px 80px;
}

.search{
  max-width:650px;
  margin:0 auto 55px;
  position:relative;
}

.search input{
  width:100%;
  padding:16px 22px;
  border-radius:40px;
  border:1px solid rgba(214,168,73,.25);
  background:#1b100a;
  color:white;
  outline:none;
  font-size:15px;
}

.search input:focus{
  border-color:#d6a849;
}

.category{
  margin-bottom:65px;
}

.category-title{
  display:flex;
  align-items:center;
  gap:15px;
  margin-bottom:25px;
}

.category-title::before,
.category-title::after{
  content:"";
  height:1px;
  flex:1;
  background:linear-gradient(90deg,transparent,#9d7026);
}

.category-title::after{
  background:linear-gradient(90deg,#9d7026,transparent);
}

.category-title h2{
  color:#e1b85e;
  white-space:nowrap;
  font-size:25px;
}

.products{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:20px;
}

.card{
  position:relative;
  overflow:hidden;
  border-radius:20px;
  background:linear-gradient(145deg,#2b1a0f,#170d08);
  border:1px solid rgba(214,168,73,.15);
  cursor:pointer;
  transition:.3s;
}

.card:hover{
  transform:translateY(-8px);
  border-color:rgba(214,168,73,.5);
  box-shadow:0 18px 40px rgba(0,0,0,.4);
}

.card-img{
  height:220px;
  background:#21140c;
  overflow:hidden;
}

.card-img img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:.4s;
}

.card:hover img{
  transform:scale(1.08);
}

.card-info{
  padding:16px;
}

.card-name{
  min-height:50px;
  display:flex;
  align-items:center;
  font-weight:800;
  font-size:15px;
}

.card-price{
  margin-top:7px;
  color:#e2b95e;
  font-size:17px;
  font-weight:900;
}

.arrow{
  position:absolute;
  left:15px;
  bottom:15px;
  width:32px;
  height:32px;
  border-radius:50%;
  background:#d6a849;
  color:#1b1008;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* ================= OVERLAY ================= */

.overlay{
  position:fixed;
  inset:0;
  z-index:3000;
  background:rgba(0,0,0,.8);
  backdrop-filter:blur(8px);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.overlay.show{
  display:flex;
}

.modal{
  width:min(900px,100%);
  max-height:92vh;
  overflow:auto;
  border-radius:25px;
  background:#180e08;
  border:1px solid rgba(214,168,73,.35);
  position:relative;
  animation:modalIn .25s ease;
}

@keyframes modalIn{
  from{
    opacity:0;
    transform:translateY(25px) scale(.97);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.close{
  position:absolute;
  top:15px;
  left:15px;
  z-index:5;
  width:38px;
  height:38px;
  border:none;
  border-radius:50%;
  background:rgba(0,0,0,.65);
  color:white;
  font-size:23px;
}

.product-modal{
  display:grid;
  grid-template-columns:1fr 1fr;
}

.modal-img{
  min-height:430px;
  background:#21140c;
}

.modal-img img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.details{
  padding:35px;
}

.details h2{
  font-family:"Playfair Display",serif;
  color:#e2b95e;
  font-size:31px;
  margin-bottom:10px;
}

.base-price{
  color:#a99884;
  font-size:14px;
  margin-bottom:25px;
}

.option-title{
  color:#e4d3bd;
  font-weight:800;
  margin-bottom:10px;
}

.weights{
  display:flex;
  gap:8px;
}

.weight{
  flex:1;
  padding:11px;
  border-radius:12px;
  border:1px solid rgba(214,168,73,.25);
  background:#21140c;
  color:#eee0ce;
}

.weight.active,
.weight:hover{
  background:#d6a849;
  color:#1a0e06;
}

.selected-price{
  color:#e4bc66;
  font-size:28px;
  font-weight:900;
  margin:22px 0;
}

.quantity{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:22px;
}

.quantity button{
  width:42px;
  height:42px;
  border-radius:50%;
  border:1px solid #a7792c;
  background:#21140c;
  color:#e2b95e;
  font-size:22px;
}

.add{
  width:100%;
  padding:15px;
  border:none;
  border-radius:14px;
  background:linear-gradient(135deg,#d6a849,#a16d1d);
  color:#180d06;
  font-weight:900;
  font-size:16px;
}

/* ================= CART ================= */

.cart-modal,
.checkout-modal{
  width:min(700px,100%);
  max-height:92vh;
  overflow:auto;
  background:#170d08;
  border:1px solid rgba(214,168,73,.35);
  border-radius:25px;
  padding:30px;
  position:relative;
}

.cart-modal h2,
.checkout-modal h2{
  color:#e1b85e;
  font-family:"Playfair Display",serif;
  font-size:30px;
  margin-bottom:25px;
}

.cart-item{
  display:grid;
  grid-template-columns:75px 1fr auto;
  gap:13px;
  align-items:center;
  padding:14px 0;
  border-bottom:1px solid rgba(255,255,255,.07);
}

.cart-img{
  width:75px;
  height:75px;
  border-radius:12px;
  overflow:hidden;
}

.cart-img img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.cart-name{
  font-weight:800;
  font-size:14px;
}

.cart-price{
  color:#dfb65b;
  font-weight:800;
  margin-top:4px;
}

.cart-controls{
  display:flex;
  align-items:center;
  gap:6px;
}

.cart-controls button{
  width:30px;
  height:30px;
  border-radius:8px;
  border:1px solid rgba(214,168,73,.25);
  background:#21140c;
  color:#e0b55b;
}

.remove{
  color:#ef8d7d!important;
}

.summary{
  margin-top:25px;
  padding-top:20px;
  border-top:1px solid rgba(214,168,73,.2);
}

.row{
  display:flex;
  justify-content:space-between;
  padding:6px 0;
  color:#cdbca7;
}

.total{
  color:#e3b95e;
  font-size:21px;
  font-weight:900;
}

.checkout{
  width:100%;
  margin-top:18px;
  padding:15px;
  border:none;
  border-radius:14px;
  background:#25d366;
  color:#06150b;
  font-weight:900;
  font-size:16px;
}

.empty{
  text-align:center;
  padding:45px 10px;
  color:#9c8b79;
}

/* ================= FORM ================= */

.form-group{
  margin-bottom:15px;
}

.form-group label{
  display:block;
  color:#d7c6b1;
  font-size:14px;
  margin-bottom:7px;
}

.form-group input,
.form-group textarea,
.form-group select{
  width:100%;
  padding:13px;
  border-radius:12px;
  border:1px solid rgba(214,168,73,.2);
  outline:none;
  background:#21140c;
  color:white;
}

.form-group textarea{
  min-height:90px;
  resize:vertical;
}

.send{
  width:100%;
  padding:15px;
  border:none;
  border-radius:14px;
  background:#25d366;
  color:#06150b;
  font-weight:900;
  font-size:16px;
}

/* ================= FOOTER ================= */

footer{
  text-align:center;
  padding:35px 20px;
  border-top:1px solid rgba(214,168,73,.15);
  color:#847464;
}

footer strong{
  color:#d6a849;
}

/* ================= MOBILE ================= */

@media(max-width:1000px){
  .products{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:700px){

  .hero{
    min-height:570px;
  }

  .hero h2{
    font-size:55px;
  }

  .hero p{
    font-size:14px;
  }

  .products{
    grid-template-columns:repeat(2,1fr);
    gap:13px;
  }

  .card-img{
    height:170px;
  }

  .card-info{
    padding:12px;
  }

  .card-name{
    font-size:13px;
  }

  .card-price{
    font-size:15px;
  }

  .product-modal{
    grid-template-columns:1fr;
  }

  .modal-img{
    min-height:280px;
    max-height:350px;
  }

  .details{
    padding:24px;
  }

  .category-title h2{
    font-size:20px;
  }
}

@media(max-width:430px){

  .logo h1{
    font-size:17px;
  }

  .logo span{
    display:none;
  }

  .hero h2{
    font-size:46px;
  }

  .products{
    gap:10px;
  }

  .card-img{
    height:145px;
  }
}
</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header>
  <div class="navbar">

    <div class="logo">

      <div class="logo-circle">
        1909
      </div>

      <div>
        <h1>هريسة الحلبي</h1>
        <span>حلويات من زمان ولسه مكملة</span>
      </div>

    </div>

    <button class="cart-btn" onclick="openCart()">
      🛒 السلة
      <span class="cart-count" id="cartCount">0</span>
    </button>

  </div>
</header>


<!-- ================= HERO ================= -->

<section class="hero">

  <div class="hero-content">

    <div class="hero-small">
      منــذ عــام 1909
    </div>

    <h2>
      هريسة الحلبي
    </h2>

    <div class="hero-line"></div>

    <p>
      حلاوة ليها حكاية...
      وطعم اتعرف واتحب من جيل لجيل.
      اختار اللي نفسك فيه وخلي الباقي علينا.
    </p>

    <button class="hero-btn" onclick="goMenu()">
      شوف المنيو
    </button>

  </div>

</section>


<!-- ================= MENU ================= -->

<main class="menu" id="menu">

  <div class="search">
    <input
      type="text"
      id="search"
      placeholder="دور على الصنف اللي نفسك فيه..."
      oninput="searchProducts()"
    >
  </div>

  <div id="categories"></div>

</main>


<footer>
  <strong>هريسة الحلبي</strong>
  <br>
  منذ 1909
</footer>


<!-- ================= PRODUCT MODAL ================= -->

<div class="overlay" id="productOverlay">

  <div class="modal">

    <button class="close" onclick="closeProduct()">×</button>

    <div class="product-modal">

      <div class="modal-img">
        <img id="modalImage" src="" alt="">
      </div>

      <div class="details">

        <h2 id="modalName"></h2>

        <div class="base-price" id="basePrice"></div>

        <div id="weightBox">

          <div class="option-title">
            اختار الوزن
          </div>

          <div class="weights">

            <button class="weight" data-weight=".25" onclick="selectWeight(.25)">
              ¼ كيلو
            </button>

            <button class="weight" data-weight=".5" onclick="selectWeight(.5)">
              ½ كيلو
            </button>

            <button class="weight active" data-weight="1" onclick="selectWeight(1)">
              1 كيلو
            </button>

          </div>

        </div>

        <div class="selected-price" id="selectedPrice"></div>

        <div class="option-title">
          الكمية
        </div>

        <div class="quantity">

          <button onclick="changeCurrentQty(-1)">−</button>

          <strong id="currentQty">1</strong>

          <button onclick="changeCurrentQty(1)">+</button>

        </div>

        <button class="add" onclick="addToCart()">
          🛒 أضف للسلة
        </button>

      </div>

    </div>

  </div>

</div>


<!-- ================= CART ================= -->

<div class="overlay" id="cartOverlay">

  <div class="cart-modal">

    <button class="close" onclick="closeCart()">×</button>

    <h2>
      سلة الطلب
    </h2>

    <div id="cartItems"></div>

    <div class="summary" id="summary"></div>

  </div>

</div>


<!-- ================= CHECKOUT ================= -->

<div class="overlay" id="checkoutOverlay">

  <div class="checkout-modal">

    <button class="close" onclick="closeCheckout()">×</button>

    <h2>
      بيانات الطلب
    </h2>

    <div class="form-group">
      <label>الاسم</label>
      <input id="name" type="text" placeholder="اكتب اسمك">
    </div>

    <div class="form-group">
      <label>رقم الموبايل</label>
      <input id="phone" type="tel" placeholder="01xxxxxxxxx">
    </div>

    <div class="form-group">
      <label>العنوان</label>
      <textarea id="address" placeholder="اكتب عنوان التوصيل بالتفصيل"></textarea>
    </div>

    <div class="form-group">

      <label>
        أقرب فرع
      </label>

      <select id="branch">

        <option value="">
          اختار الفرع
        </option>

        <option>سموحة</option>
        <option>رشدي</option>
        <option>جليم</option>
        <option>المندرة</option>
        <option>العجمي</option>
        <option>محمد نجيب</option>
        <option>المنشية</option>

      </select>

    </div>

    <button class="send" onclick="sendOrder()">
      📱 إرسال الطلب على واتساب
    </button>

  </div>

</div>


<script>

/* ================= SETTINGS ================= */

const WHATSAPP_NUMBER = "201204563039";

const DELIVERY = 35;


/* ================= PRODUCTS ================= */

const categories = [

    name:"🍯 الهريسة",
    products:[

    ]
  },

  {

    products:[
      {id:24,name:"بلح الشام",price:260,weighted:true},
      {id:26,name:"صوابع زينب",price:280,weighted:true},
      {id:31,name:"بسيمة مكسرات",price:320,weighted:true},
      {id:32,name:"حجازية مكسرات",price:270,weighted:true},
      {id:34,name:"شهد (لينزا)",price:320,weighted:true},
      {id:36,name:"شكلمة مكسرات",price:380,weighted:true},
      {id:37,name:"عزيزة",price:180,weighted:true},
      {id:43,name:"وربات قشطة",price:600,weighted:true}
    ]
  },

  {
    name:"🥜 البقلاوة",
    products:[
      {id:39,name:"بقلاوة باللوز",price:700,weighted:true}
    ]
  },

  {
    name:"🥐 المخبوزات",
    products:[
      {id:59,name:"علبة باتون ساليه",price:70,weighted:false},
      {id:60,name:"كرواسون سادة",price:40,weighted:false},
      {id:61,name:"كرواسون جبنة",price:50,weighted:false},
      {id:66,name:"كرواسون نوتيلا",price:60,weighted:false}

  {

    ]
  },

  {
    name:"🍰 الحلويات الغربية",
    products:[
      {id:76,name:"ملفيه نوتيلا",price:40,weighted:false},
      {id:78,name:"إكلير نوتيلا",price:40,weighted:false},
      {id:79,name:"ميني بولا شوكولاتة",price:18,weighted:false},
      {id:87,name:"قطعة موس مانجو",price:50,weighted:false},
      {id:90,name:"تورتة فيرنوار شوكولاتة 24",price:450,weighted:false},
      {id:91,name:"تورتة موس مانجو 24",price:400,weighted:false},
      {id:92,name:"تورتة فلوتس مقاس 30",price:650,weighted:false},
      {id:96,name:"مولتن كيك",price:70,weighted:false}
    ]
  }

];


/* ================= STATE ================= */

let cart = [];

let currentProduct = null;

let currentWeight = 1;

let currentQty = 1;


/* ================= IMAGE ================= */

function image(product){

  return `images/${product.id}.jpg`;

}


/* ================= RENDER ================= */

function renderProducts(){

  const container =
    document.getElementById("categories");

  container.innerHTML = "";

  categories.forEach(category => {

    const section =
      document.createElement("section");

    section.className = "category";

    section.innerHTML = `

      <div class="category-title">
        <h2>${category.name}</h2>
      </div>

      <div class="products"></div>

    `;

    const products =
      section.querySelector(".products");

    category.products.forEach(product => {

      const card =
        document.createElement("div");

      card.className = "card";

      card.dataset.name =
        product.name.toLowerCase();

      card.innerHTML = `

        <div class="card-img">

          <img
            src="${image(product)}"
            alt="${product.name}"
            onerror="this.src='https://via.placeholder.com/600x500/21140c/d6a849?text=هريسة+الحلبي'"
          >

        </div>

        <div class="card-info">

          <div class="card-name">
            ${product.name}
          </div>

          <div class="card-price">
            ${
              product.weighted
              ? product.price + " جنيه / كيلو"
              : product.price + " جنيه"
            }
          </div>

        </div>

        <div class="arrow">
          ←
        </div>

      `;

      card.onclick = () => openProduct(product);

      products.appendChild(card);

    });

    container.appendChild(section);

  });

}


/* ================= PRODUCT ================= */

function openProduct(product){

  currentProduct = product;

  currentWeight = 1;

  currentQty = 1;

  document.getElementById("modalImage").src =
    image(product);

  document.getElementById("modalName").textContent =
    product.name;

  document.getElementById("currentQty").textContent =
    "1";

  if(product.weighted){

    document.getElementById("weightBox").style.display =
      "block";

    document.getElementById("basePrice").textContent =
      `${product.price} جنيه للكيلو`;

    document.querySelectorAll(".weight")
      .forEach(btn => {

        btn.classList.remove("active");

        if(btn.dataset.weight === "1"){
          btn.classList.add("active");
        }

      });

  }else{

    document.getElementById("weightBox").style.display =
      "none";

    document.getElementById("basePrice").textContent =
      `${product.price} جنيه`;

  }

  updatePrice();

  document
    .getElementById("productOverlay")
    .classList.add("show");

}


function closeProduct(){

  document
    .getElementById("productOverlay")
    .classList.remove("show");

}


/* ================= WEIGHT ================= */

function selectWeight(weight){

  currentWeight = weight;

  document.querySelectorAll(".weight")
    .forEach(btn => {

      btn.classList.remove("active");

      if(Number(btn.dataset.weight) === weight){

        btn.classList.add("active");

      }

    });

  updatePrice();

}


/* ================= PRICE ================= */

function updatePrice(){

  if(!currentProduct) return;

  let price =
    currentProduct.weighted
    ? currentProduct.price * currentWeight
    : currentProduct.price;

  price *= currentQty;

  document.getElementById("selectedPrice").textContent =
    price.toFixed(2) + " جنيه";

}


/* ================= QUANTITY ================= */

function changeCurrentQty(change){

  currentQty += change;

  if(currentQty < 1){
    currentQty = 1;
  }

  document.getElementById("currentQty").textContent =
    currentQty;

  updatePrice();

}


/* ================= ADD CART ================= */

function addToCart(){

  if(!currentProduct) return;

  const price =
    currentProduct.weighted
    ? currentProduct.price * currentWeight
    : currentProduct.price;

  const existing =
    cart.find(item =>
      item.id === currentProduct.id &&
      item.weight === currentWeight
    );

  if(existing){

    existing.qty += currentQty;

  }else{

    cart.push({

      id:currentProduct.id,
      name:currentProduct.name,
      price:price,
      weighted:currentProduct.weighted,
      weight:currentProduct.weighted
        ? currentWeight
        : null,
      qty:currentQty

    });

  }

  updateCartCount();

  closeProduct();

  openCart();

}


/* ================= CART COUNT ================= */

function updateCartCount(){

  const count =
    cart.reduce(
      (sum,item) => sum + item.qty,
      0
    );

  document.getElementById("cartCount").textContent =
    count;

}


/* ================= CART ================= */

function openCart(){

  renderCart();

  document
    .getElementById("cartOverlay")
    .classList.add("show");

}


function closeCart(){

  document
    .getElementById("cartOverlay")
    .classList.remove("show");

}


function renderCart(){

  const box =
    document.getElementById("cartItems");

  const summary =
    document.getElementById("summary");

  if(cart.length === 0){

    box.innerHTML = `
      <div class="empty">
        🛒
        <br><br>
        السلة فاضية دلوقتي
      </div>
    `;

    summary.innerHTML = "";

    return;

  }

  box.innerHTML = "";

  cart.forEach((item,index) => {

    const total =
      item.price * item.qty;

    const weightText =
      item.weighted
      ? item.weight === .25
        ? "¼ كيلو"
        : item.weight === .5
          ? "½ كيلو"
          : "1 كيلو"
      : "";

    const row =
      document.createElement("div");

    row.className = "cart-item";

    row.innerHTML = `

      <div class="cart-img">

        <img
          src="${image(item)}"
          alt="${item.name}"
          onerror="this.src='https://via.placeholder.com/200x200/21140c/d6a849?text=حلا'"
        >

      </div>

      <div>

        <div class="cart-name">
          ${item.name}
        </div>

        <small>
          ${weightText}
        </small>

        <div class="cart-price">
          ${total.toFixed(2)} جنيه
        </div>

      </div>

      <div class="cart-controls">

        <button onclick="changeCart(${index},1)">
          +
        </button>

        <strong>
          ${item.qty}
        </strong>

        <button onclick="changeCart(${index},-1)">
          −
        </button>

        <button
          class="remove"
          onclick="removeCart(${index})"
        >
          ×
        </button>

      </div>

    `;

    box.appendChild(row);

  });

  const subtotal =
    cart.reduce(
      (sum,item) =>
        sum + item.price * item.qty,
      0
    );

  const total =
    subtotal + DELIVERY;

  summary.innerHTML = `

    <div class="row">
      <span>المجموع</span>
      <strong>${subtotal.toFixed(2)} جنيه</strong>
    </div>

    <div class="row">
      <span>التوصيل</span>
      <strong>${DELIVERY} جنيه</strong>
    </div>

    <div class="row total">
      <span>الإجمالي</span>
      <strong>${total.toFixed(2)} جنيه</strong>
    </div>

    <button class="checkout" onclick="openCheckout()">
      إكمال الطلب
    </button>

  `;

}


function changeCart(index,change){

  cart[index].qty += change;

  if(cart[index].qty <= 0){

    cart.splice(index,1);

  }

  updateCartCount();

  renderCart();

}


function removeCart(index){

  cart.splice(index,1);

  updateCartCount();

  renderCart();

}


/* ================= CHECKOUT ================= */

function openCheckout(){

  if(cart.length === 0) return;

  closeCart();

  document
    .getElementById("checkoutOverlay")
    .classList.add("show");

}


function closeCheckout(){

  document
    .getElementById("checkoutOverlay")
    .classList.remove("show");

}


/* ================= WHATSAPP ================= */

function sendOrder(){

  const name =
    document.getElementById("name").value.trim();

  const phone =
    document.getElementById("phone").value.trim();

  const address =
    document.getElementById("address").value.trim();

  const branch =
    document.getElementById("branch").value;


  if(!name){
    alert("اكتب اسمك");
    return;
  }

  if(!phone){
    alert("اكتب رقم الموبايل");
    return;
  }

  if(!address){
    alert("اكتب العنوان");
    return;
  }

  if(!branch){
    alert("اختار الفرع");
    return;
  }

  let subtotal =
    cart.reduce(
      (sum,item) =>
        sum + item.price * item.qty,
      0
    );

  let total =
    subtotal + DELIVERY;


  let message =
`🍰 طلب جديد من هريسة الحلبي

👤 الاسم: ${name}
📱 الموبايل: ${phone}
📍 العنوان: ${address}
🏪 الفرع: ${branch}

━━━━━━━━━━━━━━

🛒 تفاصيل الطلب:

`;


  cart.forEach((item,index) => {

    message +=
`${index + 1}- ${item.name}
`;

    if(item.weighted){

      const weight =
        item.weight === .25
        ? "¼ كيلو"
        : item.weight === .5
          ? "½ كيلو"
          : "1 كيلو";

      message +=
`الوزن: ${weight}
`;

    }

    message +=
`الكمية: ${item.qty}
السعر: ${(item.price * item.qty).toFixed(2)} جنيه

`;

  });


  message +=
`━━━━━━━━━━━━━━

💰 المجموع: ${subtotal.toFixed(2)} جنيه
🚚 التوصيل: ${DELIVERY} جنيه
💵 الإجمالي: ${total.toFixed(2)} جنيه

شكراً لطلبك من هريسة الحلبي ❤️`;


  const url =
    `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;


  window.open(url,"_blank");

}


/* ================= SEARCH ================= */

function searchProducts(){

  const value =
    document
      .getElementById("search")
      .value
      .trim()
      .toLowerCase();


  document
    .querySelectorAll(".category")
    .forEach(category => {

      let visible = 0;

      category
        .querySelectorAll(".card")
        .forEach(card => {

          const name =
            card.dataset.name;

          if(
            !value ||
            name.includes(value)
          ){

            card.style.display = "";

            visible++;

          }else{

            card.style.display = "none";

          }

        });


      category.style.display =
        visible ? "" : "none";

    });

}


/* ================= SCROLL ================= */

function goMenu(){

  document
    .getElementById("menu")
    .scrollIntoView({
      behavior:"smooth"
    });

}


/* ================= START ================= */

renderProducts();

updateCartCount();

</script>
