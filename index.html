<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>هريسة الحلبي | منذ 1909</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">

<style>
:root{
    --gold:#d7ad55;
    --gold-light:#f4d990;
    --gold-dark:#9d7429;

    --bg:#070504;
    --bg2:#100a07;
    --bg3:#1a0f09;

    --card:#17100c;
    --card2:#21140d;

    --text:#fff8ed;
    --muted:#bcae9d;

    --border:rgba(215,173,85,.20);
    --border-hover:rgba(215,173,85,.48);

    --shadow:0 18px 50px rgba(0,0,0,.38);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:"Cairo",sans-serif;
    color:var(--text);
    background:
        radial-gradient(circle at 15% 5%,rgba(142,78,28,.18),transparent 28%),
        radial-gradient(circle at 90% 35%,rgba(104,55,20,.14),transparent 30%),
        linear-gradient(180deg,#060403 0%,#120a06 48%,#080504 100%);
    min-height:100vh;
    overflow-x:hidden;
}

/* ================= HEADER ================= */

.header{
    position:sticky;
    top:0;
    z-index:1000;

    background:rgba(7,5,4,.91);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);

    border-bottom:1px solid rgba(215,173,85,.12);
}

.header-inner{
    width:min(1250px,92%);
    margin:auto;

    min-height:76px;

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo-mark{
    width:48px;
    height:48px;
    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    border:1px solid rgba(215,173,85,.55);

    background:
        radial-gradient(circle at 35% 30%,#e9ca7c,#9b6b25 65%,#53350f);

    color:#120a04;
    font-weight:900;
    font-size:20px;

    box-shadow:0 0 25px rgba(215,173,85,.12);
}

.logo-text{
    line-height:1.15;
}

.logo-text strong{
    display:block;
    font-size:17px;
    color:var(--gold-light);
}

.logo-text span{
    display:block;
    font-size:11px;
    color:var(--muted);
    margin-top:3px;
}

.cart-top{
    border:1px solid var(--border);
    background:rgba(215,173,85,.07);
    color:var(--gold-light);

    padding:10px 16px;
    border-radius:12px;

    cursor:pointer;
    font-family:inherit;
    font-weight:700;

    transition:.2s ease;
}

.cart-top:hover{
    border-color:var(--border-hover);
    background:rgba(215,173,85,.13);
    transform:translateY(-2px);
}

.cart-count{
    display:inline-flex;
    align-items:center;
    justify-content:center;

    min-width:23px;
    height:23px;

    margin-right:5px;

    border-radius:50%;
    background:var(--gold);
    color:#170d05;

    font-size:12px;
    font-weight:900;
}

/* ================= HERO ================= */

.hero{
    min-height:500px;
    padding:38px 5% 25px;

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;
}

.hero-main{
    width:min(1150px,100%);

    display:flex;
    align-items:center;
    justify-content:center;

    gap:38px;

    direction:ltr;
}

.hero-offer{
    width:145px;
    height:215px;

    flex:none;

    transform:rotate(-6deg);

    overflow:hidden;

    border-radius:18px;

    border:1px solid rgba(215,173,85,.38);

    box-shadow:
        0 22px 55px rgba(0,0,0,.55),
        0 0 30px rgba(215,173,85,.08);

    background:#160d08;

    direction:ltr;
}

.hero-offer img{
    width:100%;
    height:100%;

    display:block;

    object-fit:cover;
}

.hero-content{
    direction:rtl;
    text-align:center;

    max-width:720px;
}

.hero-kicker{
    color:var(--gold);
    font-family:"Playfair Display",serif;

    font-size:14px;
    letter-spacing:2px;

    margin-bottom:12px;
}

.hero-title{
    font-family:"Playfair Display","Cairo",serif;

    font-size:clamp(48px,7vw,82px);
    line-height:1;

    margin-bottom:20px;

    color:#fff8eb;

    text-shadow:0 8px 30px rgba(0,0,0,.4);
}

.hero-title span{
    color:var(--gold-light);
}

.hero-sub{
    color:var(--muted);

    max-width:650px;
    margin:0 auto 25px;

    line-height:2;
    font-size:15px;
}

.hero-buttons{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
}

.main-btn,
.secondary-btn{
    font-family:inherit;
    cursor:pointer;

    min-height:48px;

    padding:11px 22px;

    border-radius:13px;

    font-weight:800;
    font-size:14px;

    transition:.2s ease;
}

.main-btn{
    border:1px solid var(--gold);
    color:#1a0d04;

    background:
        linear-gradient(135deg,#f2d48b,#b78332);

    box-shadow:0 10px 28px rgba(215,173,85,.13);
}

.main-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 14px 32px rgba(215,173,85,.20);
}

.secondary-btn{
    color:var(--gold-light);
    background:rgba(215,173,85,.06);
    border:1px solid var(--border);
}

.secondary-btn:hover{
    transform:translateY(-3px);
    border-color:var(--border-hover);
    background:rgba(215,173,85,.11);
}

/* ================= MENU ================= */

.section{
    width:min(1250px,92%);
    margin:auto;
    padding:18px 0 65px;
}

.section-head{
    text-align:center;
    margin-bottom:20px;
}

.section-kicker{
    color:var(--gold);
    font-size:12px;
    font-weight:800;
    letter-spacing:1.5px;
    margin-bottom:5px;
}

.section-head h2{
    font-family:"Playfair Display","Cairo",serif;
    font-size:38px;
    color:#fff8ed;
}

.section-head p{
    color:var(--muted);
    font-size:14px;
    margin-top:5px;
}

/* ================= SEARCH ================= */

.search-box{
    width:min(650px,100%);
    margin:0 auto 28px;

    position:relative;
}

.search-box input{
    width:100%;
    height:50px;

    border-radius:14px;

    border:1px solid var(--border);

    outline:none;

    background:#120b07;
    color:#fff;

    padding:0 18px;

    font-family:inherit;
    font-size:14px;

    transition:.2s ease;
}

.search-box input:focus{
    border-color:var(--gold);
    box-shadow:0 0 0 3px rgba(215,173,85,.07);
}

.search-box input::placeholder{
    color:#817467;
}

/* ================= CATEGORIES ================= */

.category{
    margin-bottom:42px;
}

.category-title{
    display:flex;
    align-items:center;
    gap:13px;

    margin-bottom:17px;
}

.category-title h3{
    color:var(--gold-light);
    font-size:24px;
    white-space:nowrap;
}

.category-line{
    height:1px;
    flex:1;

    background:
        linear-gradient(
            to left,
            rgba(215,173,85,.35),
            transparent
        );
}

/* ================= PRODUCTS ================= */

.products{
    display:grid;

    grid-template-columns:
        repeat(4,minmax(0,1fr));

    gap:16px;
}

.product-card{
    min-width:0;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.025),
            rgba(255,255,255,.005)
        ),
        var(--card);

    border:1px solid var(--border);

    border-radius:18px;

    overflow:hidden;

    box-shadow:0 12px 35px rgba(0,0,0,.18);

    transition:
        transform .2s ease,
        border-color .2s ease,
        box-shadow .2s ease;

    cursor:pointer;

    /* مهم: مفيش ظهور تدريجي */
    opacity:1;
    transform:none;
}

.product-card:hover{
    transform:translateY(-5px);

    border-color:var(--border-hover);

    box-shadow:
        0 18px 42px rgba(0,0,0,.35),
        0 0 25px rgba(215,173,85,.05);
}

.product-img{
    width:100%;
    height:220px;

    background:#0d0805;

    overflow:hidden;
}

.product-img img{
    width:100%;
    height:100%;

    display:block;

    object-fit:cover;

    transition:transform .25s ease;
}

.product-card:hover .product-img img{
    transform:scale(1.035);
}

.product-info{
    padding:14px;
}

.product-name{
    color:#fff5e8;

    font-size:14px;
    font-weight:800;

    line-height:1.7;

    min-height:48px;
}

.product-price{
    color:var(--gold-light);

    font-size:18px;
    font-weight:900;

    margin-top:8px;
}

.product-note{
    color:#8f8174;
    font-size:11px;
    margin-top:2px;
}

/* ================= MODALS ================= */

.modal{
    position:fixed;
    inset:0;

    z-index:2000;

    display:none;
    align-items:center;
    justify-content:center;

    padding:15px;

    background:rgba(0,0,0,.78);

    backdrop-filter:blur(7px);
    -webkit-backdrop-filter:blur(7px);
}

.modal.active{
    display:flex;
}

.modal-box{
    width:min(570px,96%);

    max-height:92vh;

    overflow-y:auto;

    border-radius:22px;

    border:1px solid var(--border);

    background:
        linear-gradient(
            145deg,
            #21140d,
            #0e0906 75%
        );

    box-shadow:0 30px 90px rgba(0,0,0,.65);

    position:relative;

    animation:modalIn .16s ease-out;
}

@keyframes modalIn{
    from{
        opacity:0;
        transform:scale(.97);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

.close{
    position:absolute;

    top:12px;
    left:12px;

    width:38px;
    height:38px;

    border-radius:50%;

    border:1px solid rgba(255,255,255,.10);

    background:rgba(0,0,0,.55);

    color:#fff;

    cursor:pointer;

    z-index:5;

    font-size:20px;
}

.modal-image{
    width:100%;
    height:280px;

    background:#0d0805;
}

.modal-image img{
    width:100%;
    height:100%;

    display:block;

    object-fit:cover;
}

.modal-content{
    padding:20px;
}

.modal-content h3{
    color:var(--gold-light);
    font-size:24px;
    margin-bottom:5px;
}

.modal-price{
    color:#fff;
    font-size:20px;
    font-weight:900;
    margin-bottom:18px;
}

.weight-title{
    color:#cdbdaa;
    font-size:13px;
    margin-bottom:8px;
}

.weights{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:18px;
}

.weight-btn{
    padding:9px 15px;

    border-radius:10px;

    border:1px solid var(--border);

    background:#120b07;
    color:#d6c6b4;

    cursor:pointer;

    font-family:inherit;
    font-weight:700;

    transition:.18s ease;
}

.weight-btn.active,
.weight-btn:hover{
    color:#1b0d04;
    background:var(--gold);
    border-color:var(--gold);
}

.quantity{
    display:flex;
    align-items:center;
    gap:12px;

    margin-bottom:18px;
}

.quantity button{
    width:40px;
    height:40px;

    border-radius:10px;

    border:1px solid var(--border);

    background:#120b07;
    color:var(--gold-light);

    cursor:pointer;

    font-size:20px;
    font-weight:900;
}

.quantity span{
    min-width:30px;
    text-align:center;
    font-weight:900;
}

.add-btn{
    width:100%;

    min-height:50px;

    border:none;
    border-radius:13px;

    background:
        linear-gradient(135deg,#f0d084,#a9762c);

    color:#180c04;

    font-family:inherit;
    font-size:15px;
    font-weight:900;

    cursor:pointer;

    transition:.2s ease;
}

.add-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 25px rgba(215,173,85,.15);
}

/* ================= CART ================= */

.cart-items{
    padding:20px;
}

.cart-empty{
    text-align:center;
    color:var(--muted);
    padding:35px 10px;
}

.cart-item{
    display:flex;
    align-items:center;
    gap:12px;

    padding:12px 0;

    border-bottom:1px solid rgba(255,255,255,.07);
}

.cart-item:last-child{
    border-bottom:none;
}

.cart-item-image{
    width:62px;
    height:62px;

    flex:none;

    border-radius:12px;

    overflow:hidden;

    background:#0b0705;
}

.cart-item-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.cart-item-info{
    flex:1;
    min-width:0;
}

.cart-item-name{
    font-size:13px;
    font-weight:800;

    line-height:1.6;
}

.cart-item-details{
    color:#9e8e7d;
    font-size:11px;
    margin-top:3px;
}

.cart-item-price{
    color:var(--gold-light);
    font-size:13px;
    font-weight:900;
    margin-top:3px;
}

.cart-controls{
    display:flex;
    align-items:center;
    gap:5px;
    margin-top:7px;
}

.cart-controls button{
    width:27px;
    height:27px;

    border-radius:7px;

    border:1px solid var(--border);

    background:#120b07;
    color:var(--gold-light);

    cursor:pointer;

    font-weight:900;
}

.remove-btn{
    color:#e8a5a5 !important;
    border-color:rgba(200,80,80,.2) !important;
}

.cart-summary{
    padding:18px 20px 20px;

    border-top:1px solid rgba(215,173,85,.12);
}

.summary-row{
    display:flex;
    justify-content:space-between;

    color:#c4b5a3;

    font-size:13px;

    margin-bottom:8px;
}

.summary-row.total{
    color:var(--gold-light);

    font-size:18px;
    font-weight:900;

    margin-top:12px;
}

.checkout-btn{
    width:100%;

    min-height:49px;

    margin-top:15px;

    border:none;
    border-radius:13px;

    background:linear-gradient(135deg,#f0d084,#a9762c);

    color:#180c04;

    font-family:inherit;
    font-weight:900;

    cursor:pointer;
}

/* ================= FORM ================= */

.form{
    padding:20px;
}

.form-title{
    font-family:"Playfair Display","Cairo",serif;

    color:var(--gold-light);

    font-size:25px;

    margin-bottom:18px;
}

.form-group{
    margin-bottom:13px;
}

.form-group label{
    display:block;

    color:#c8b9a8;

    font-size:12px;
    font-weight:700;

    margin-bottom:6px;
}

.form-group input,
.form-group textarea,
.form-group select{
    width:100%;

    border:1px solid var(--border);

    border-radius:11px;

    background:#17100b !important;
    color:#fff !important;

    outline:none;

    font-family:inherit;
    font-size:14px;

    padding:11px 13px;

    transition:.18s ease;
}

.form-group input,
.form-group select{
    min-height:48px;
}

.form-group textarea{
    min-height:95px;
    resize:vertical;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus{
    border-color:var(--gold);
    box-shadow:0 0 0 3px rgba(215,173,85,.07);
}

/* مهم جداً للقائمة المنسدلة */

.form-group select{
    appearance:none;
    -webkit-appearance:none;
    -moz-appearance:none;

    cursor:pointer;

    background-color:#17100b !important;
    color:#fff !important;
}

.form-group select option{
    background:#17100b !important;
    color:#fff !important;
}

.form-group input::placeholder,
.form-group textarea::placeholder{
    color:#817466;
}

.form-total{
    display:flex;
    justify-content:space-between;

    margin:16px 0;

    padding:13px;

    border-radius:12px;

    background:rgba(215,173,85,.06);

    border:1px solid rgba(215,173,85,.12);

    color:var(--gold-light);

    font-weight:900;
}

/* ================= TOAST ================= */

.toast{
    position:fixed;

    bottom:22px;
    left:50%;

    transform:translateX(-50%);

    z-index:5000;

    background:#21140d;

    color:#fff;

    border:1px solid var(--border);

    border-radius:12px;

    padding:11px 18px;

    box-shadow:0 15px 40px rgba(0,0,0,.45);

    font-size:13px;
    font-weight:700;

    animation:toastIn .2s ease;
}

@keyframes toastIn{
    from{
        opacity:0;
        transform:translate(-50%,8px);
    }
    to{
        opacity:1;
        transform:translate(-50%,0);
    }
}

/* ================= RESPONSIVE ================= */

@media(max-width:1050px){

    .products{
        grid-template-columns:repeat(3,minmax(0,1fr));
    }

    .hero{
        min-height:480px;
    }
}

@media(max-width:720px){

    .header-inner{
        min-height:68px;
    }

    .logo-mark{
        width:43px;
        height:43px;
        font-size:18px;
    }

    .logo-text strong{
        font-size:15px;
    }

    .logo-text span{
        font-size:9px;
    }

    .cart-top{
        padding:8px 11px;
        font-size:12px;
    }

    .hero{
        min-height:auto;
        padding:32px 5% 18px;
    }

    .hero-main{
        flex-direction:column;
        gap:22px;
    }

    .hero-offer{
        order:0;

        width:110px;
        height:165px;

        transform:rotate(-5deg);
    }

    .hero-content{
        width:100%;
    }

    .hero-title{
        font-size:47px;
        margin-bottom:15px;
    }

    .hero-sub{
        font-size:13px;
        line-height:1.9;
        margin-bottom:18px;
    }

    .hero-kicker{
        font-size:11px;
    }

    .section{
        width:92%;
        padding:12px 0 45px;
    }

    .section-head{
        margin-bottom:18px;
    }

    .section-head h2{
        font-size:30px;
    }

    .section-head p{
        font-size:12px;
    }

    .search-box{
        margin-bottom:20px;
    }

    .products{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:11px;
    }

    .product-img{
        height:170px;
    }

    .product-info{
        padding:10px;
    }

    .product-name{
        font-size:12px;
        min-height:44px;
    }

    .product-price{
        font-size:15px;
        margin-top:6px;
    }

    .category{
        margin-bottom:32px;
    }

    .category-title h3{
        font-size:20px;
    }

    .modal-box{
        width:96%;
        max-height:93vh;
        border-radius:20px;
    }

    .modal-image{
        height:230px;
    }

    .form{
        padding:17px;
    }
}

@media(max-width:420px){

    .hero-title{
        font-size:40px;
    }

    .hero-offer{
        width:100px;
        height:150px;
    }

    .products{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:9px;
    }

    .product-img{
        height:145px;
    }

    .product-card{
        border-radius:16px;
    }

    .product-name{
        font-size:11px;
    }

    .product-price{
        font-size:14px;
    }

    .section-head h2{
        font-size:27px;
    }

    .category-title h3{
        font-size:18px;
    }

    .modal-image{
        height:210px;
    }
}
</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header class="header">
    <div class="header-inner">

        <div class="logo">
            <div class="logo-mark">ح</div>

            <div class="logo-text">
                <strong>هريسة الحلبي</strong>
                <span>منذ 1909</span>
            </div>
        </div>

        <button class="cart-top" onclick="openCart()">
            🛒 السلة
            <span class="cart-count" id="cartCount">0</span>
        </button>

    </div>
</header>


<!-- ================= HERO ================= -->

<section class="hero">

    <div class="hero-main">

        <div class="hero-offer">
            <img
                src="images/offer.jpg"
                alt="عرض خاص"
                onerror="this.src='images/1.jpg'"
            >
        </div>

        <div class="hero-content">

            <div class="hero-kicker">
                HALABY • EST. 1909
            </div>

            <h1 class="hero-title">
                هريسة <span>الحلبي</span>
            </h1>

            <p class="hero-sub">
                طعم له حكاية من زمان، وحلويات معمولة بحب وجودة تليق باسم الحلبي.
            </p>

            <div class="hero-buttons">

                <button
                    class="main-btn"
                    onclick="document.getElementById('menu').scrollIntoView({behavior:'smooth'})"
                >
                    شوف المنيو
                </button>

                <button
                    class="secondary-btn"
                    onclick="openCart()"
                >
                    🛒 السلة

function formatPrice(price){

    return Number(price).toLocaleString("ar-EG");

}


function getProduct(id){

    return products.find(
        product => product.id === id
    );

}


/* =========================================================

========================================================= */

function renderProducts(){

    const container =
        document.getElementById("productsContainer");

    const search =
        document.getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();

    let filtered = products.filter(product => {

        return product.name
            .toLowerCase()
            .includes(search);

    });


    const categories = [];

    filtered.forEach(product => {

        if(!categories.includes(product.category)){
            categories.push(product.category);
        }

    });


    let html = "";


    categories.forEach(category => {

        const categoryProducts =
            filtered.filter(
                product => product.category === category
            );


        html += `

            <section class="category">

                <div class="category-title">

                    <h3>
                        ${category}

                    <div class="category-line"></div>

                <div class="products">

                        >

    });


    if(filtered.length === 0){

        html = `

            <div class="cart-empty">
                مفيش صنف بالاسم ده 😅
            </div>

        `;

    }


    container.innerHTML = html;

}


/* =========================================================
   PRODUCT MODAL
========================================================= */

function openProduct(id){

    currentProduct = getProduct(id);

    if(!currentProduct) return;


    currentWeight = 1;
    currentQuantity = 1;


    document.getElementById("modalProductName")
        .textContent = currentProduct.name;


    document.getElementById("modalProductImage")
        .src = currentProduct.image;


    document.getElementById("modalProductImage")
        .alt = currentProduct.name;


    document.getElementById("modalQuantity")
        .textContent = currentQuantity;


    const weightArea =
        document.getElementById("weightArea");


    if(currentProduct.weighted){

        weightArea.style.display = "block";

        document.querySelectorAll(".weight-btn")
            .forEach(button => {

                button.classList.remove("active");

                if(button.dataset.weight === "1"){
                    button.classList.add("active");
                }

            });

    }else{

        weightArea.style.display = "none";

    }


    updateModalPrice();


    document.getElementById("productModal")
        .classList.add("active");

}


function updateModalPrice(){

    if(!currentProduct) return;


    let unitPrice =
        currentProduct.weighted
        ? currentProduct.price * currentWeight
        : currentProduct.price;


    let total =
        unitPrice * currentQuantity;


    document.getElementById("modalProductPrice")
        .textContent =
        `${formatPrice(total)} جنيه`;

}


function selectWeight(weight,button){

    currentWeight = weight;

    document.querySelectorAll(".weight-btn")
        .forEach(btn =>
            btn.classList.remove("active")
        );

    button.classList.add("active");

    updateModalPrice();

}


function changeModalQuantity(amount){

    currentQuantity += amount;

    if(currentQuantity < 1){
        currentQuantity = 1;
    }

    if(currentQuantity > 99){
        currentQuantity = 99;
    }

    document.getElementById("modalQuantity")
        .textContent = currentQuantity;

    updateModalPrice();

}


/* =========================================================
   ADD TO CART
========================================================= */

function addToCart(){

    if(!currentProduct) return;


    const existing =
        cart.find(item =>
            item.id === currentProduct.id &&
            item.weight === currentWeight
        );


    if(existing){

        existing.quantity += currentQuantity;

    }else{

        cart.push({

            id:currentProduct.id,

            weight:
                currentProduct.weighted
                ? currentWeight
                : 1,

            quantity:currentQuantity

        });

    }


    saveCart();
    updateCartCount();

    closeModal("productModal");

    showToast("اتضاف للسلة ❤️");

}


/* =========================================================
   CART COUNT
========================================================= */

function updateCartCount(){

    const count =
        cart.reduce(
            (sum,item) =>
                sum + item.quantity,
            0
        );


    document.getElementById("cartCount")
        .textContent = count;

}


/* =========================================================
   CART MODAL
========================================================= */

function openCart(){

    renderCart();

    document.getElementById("cartModal")
        .classList.add("active");

}


function renderCart(){

    const itemsBox =
        document.getElementById("cartItems");

    const summaryBox =
        document.getElementById("cartSummary");


    if(cart.length === 0){

        itemsBox.innerHTML = `

            <div class="cart-empty">
                السلة فاضية دلوقتي 😅
                <br>
                اختار حاجة حلوة الأول
            </div>

        `;

        summaryBox.innerHTML = "";

        return;

    }


    let subtotal = 0;


    itemsBox.innerHTML = cart.map((item,index) => {

        const product =
            getProduct(item.id);

        if(!product) return "";


        const unitPrice =
            product.weighted
            ? product.price * item.weight
            : product.price;


        const itemTotal =
            unitPrice * item.quantity;


        subtotal += itemTotal;


        const weightText =
            product.weighted
            ?
            `الوزن: ${getWeightText(item.weight)}`
            :
            `سعر ثابت`;


        return `

            <div class="cart-item">

                <div class="cart-item-image">

                    <img
                        src="${product.image}"
                        alt="${product.name}"
                        onerror="this.src='images/offer.jpg'"
                    >

                </div>


                <div class="cart-item-info">

                    <div class="cart-item-name">
                        ${product.name}
                    </div>

                    <div class="cart-item-details">
                        ${weightText}
                    </div>

                    <div class="cart-item-price">
                        ${formatPrice(itemTotal)} جنيه
                    </div>


                    <div class="cart-controls">

                        <button
                            onclick="changeCartQuantity(${index},-1)"
                        >
                            −
                        </button>

                        <span>
                            ${item.quantity}
                        </span>

                        <button
                            onclick="changeCartQuantity(${index},1)"
                        >
                            +
                        </button>

                        <button
                            class="remove-btn"
                            onclick="removeCartItem(${index})"
                        >
                            ×
                        </button>

                    </div>

                </div>

            </div>

        `;

    }).join("");


    const total =
        subtotal + DELIVERY_FEE;


    summaryBox.innerHTML = `

        <div class="summary-row">

            <span>
                قيمة الطلب
            </span>

            <span>
                ${formatPrice(subtotal)} جنيه
            </span>

        </div>


        <div class="summary-row">

            <span>
                التوصيل
            </span>

            <span>
                ${formatPrice(DELIVERY_FEE)} جنيه
            </span>

        </div>


        <div class="summary-row total">

            <span>
                الإجمالي
            </span>

            <span>
                ${formatPrice(total)} جنيه
            </span>

        </div>


        <button
            class="checkout-btn"
            onclick="openCheckout()"
        >
            إكمال الطلب
        </button>

    `;

}


function getWeightText(weight){

    if(weight === .25) return "¼ كيلو";
    if(weight === .5) return "½ كيلو";
    return "1 كيلو";

}


function changeCartQuantity(index,amount){

    if(!cart[index]) return;


    cart[index].quantity += amount;


    if(cart[index].quantity <= 0){

        cart.splice(index,1);

    }


    saveCart();

    updateCartCount();

    renderCart();

}


function removeCartItem(index){

    cart.splice(index,1);

    saveCart();

    updateCartCount();

    renderCart();

}


/* =========================================================
   CHECKOUT
========================================================= */

function openCheckout(){

    if(cart.length === 0){

        showToast("السلة فاضية");

        return;

    }


    closeModal("cartModal");


    calculateCheckoutTotal();


    document.getElementById("checkoutModal")
        .classList.add("active");

}


function calculateCheckoutTotal(){

    let subtotal = 0;


    cart.forEach(item => {

        const product =
            getProduct(item.id);

        if(!product) return;


        const price =
            product.weighted
            ? product.price * item.weight
            : product.price;


        subtotal += price * item.quantity;

    });


    const total =
        subtotal + DELIVERY_FEE;


    document.getElementById("checkoutTotal")
        .textContent =
        `${formatPrice(total)} جنيه`;

}

`🍰 *طلب جديد من هريسة الحلبي*

👤 الاسم: ${name}

━━━━━━━━━━━━━━

🛒 *تفاصيل الطلب:*
`;


    cart.forEach((item,index) => {

        const product =
            getProduct(item.id);

        if(!product) return;


        const unitPrice =
            product.weighted
            ? product.price * item.weight
            : product.price;


        const total =
            unitPrice * item.quantity;


        subtotal += total;


        message +=
`
${index + 1}. ${product.name}
`;

        if(product.weighted){

            message +=
`   ⚖️ الوزن: ${getWeightText(item.weight)}
`;

        }

        message +=
`   🔢 الكمية: ${item.quantity}
   💰 السعر: ${formatPrice(total)} جنيه
`;

    });


    const finalTotal =
        subtotal + DELIVERY_FEE;


    message +=
`
━━━━━━━━━━━━━━

💵 قيمة الطلب: ${formatPrice(subtotal)} جنيه

/* =========================================================
   CLOSE MODALS
========================================================= */

function closeModal(id){

    document.getElementById(id)
        .classList.remove("active");

}


/* =========================================================
   CLICK OUTSIDE MODAL
========================================================= */

document.querySelectorAll(".modal")
    .forEach(modal => {

        modal.addEventListener("click",function(e){

            if(e.target === modal){

                modal.classList.remove("active");

            }

        });

    });


/* =========================================================
   ESC CLOSE
========================================================= */

document.addEventListener("keydown",function(e){

    if(e.key === "Escape"){

        document.querySelectorAll(".modal")
            .forEach(modal =>
                modal.classList.remove("active")
            );

    }

});


/* =========================================================
   TOAST
========================================================= */

function showToast(text){

    const old =
        document.querySelector(".toast");

    if(old) old.remove();


    const toast =
        document.createElement("div");

    toast.className = "toast";

    toast.textContent = text;


    document.body.appendChild(toast);


    setTimeout(() => {

        toast.remove();

    },2200);

}
