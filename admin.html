<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لوحة تحكم الحلبي</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:"Cairo",sans-serif;
    background:
        linear-gradient(
            180deg,
            #080503,
            #140904,
            #080403
        );

    color:#fff;
    min-height:100vh;
}


/* =========================
   LOGIN
========================= */

.login-screen{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;
}

.login-box{
    width:min(420px,100%);

    background:#1b0e08;

    border:1px solid rgba(231,185,87,.28);

    border-radius:24px;

    padding:30px;

    box-shadow:0 20px 60px rgba(0,0,0,.5);

    text-align:center;
}

.logo{
    width:65px;
    height:65px;

    border-radius:50%;

    border:1px solid #e7b957;

    display:flex;
    align-items:center;
    justify-content:center;

    margin:0 auto 15px;

    color:#ffe2a0;

    font-size:25px;

    font-weight:800;
}

.login-box h1{
    color:#ffe2a0;

    margin-bottom:5px;
}

.login-box p{
    color:#a99887;

    font-size:13px;

    margin-bottom:25px;
}

.input{
    width:100%;

    padding:13px;

    border-radius:12px;

    border:1px solid rgba(255,255,255,.12);

    background:#100704;

    color:white;

    outline:none;

    font-family:inherit;

    margin-bottom:12px;
}

.input:focus{
    border-color:#e7b957;
}

.btn{
    width:100%;

    padding:13px;

    border:0;

    border-radius:12px;

    background:
        linear-gradient(
            135deg,
            #f2d27c,
            #b97d25
        );

    color:#211205;

    font-family:inherit;

    font-weight:900;

    cursor:pointer;
}

.error{
    color:#e07d72;

    font-size:12px;

    margin-top:10px;

    min-height:18px;
}


/* =========================
   ADMIN
========================= */

.admin{
    display:none;

    min-height:100vh;
}


header{
    position:sticky;

    top:0;

    z-index:10;

    height:72px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 5%;

    background:rgba(10,5,3,.97);

    border-bottom:1px solid rgba(231,185,87,.18);
}

header h1{
    color:#ffe2a0;

    font-size:20px;
}

.logout{
    background:#1b0e08;

    border:1px solid rgba(231,185,87,.25);

    color:#ffe2a0;

    border-radius:10px;

    padding:9px 15px;

    cursor:pointer;

    font-family:inherit;
}


/* =========================
   CONTENT
========================= */

.container{
    width:min(1100px,92%);

    margin:auto;

    padding:30px 0 60px;
}

.top{
    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:15px;

    margin-bottom:25px;

    flex-wrap:wrap;
}

.top h2{
    color:#fff4dc;

    font-size:26px;
}

.add-btn{
    background:
        linear-gradient(
            135deg,
            #f2d27c,
            #b97d25
        );

    border:0;

    color:#211205;

    padding:11px 18px;

    border-radius:12px;

    font-family:inherit;

    font-weight:900;

    cursor:pointer;
}


/* =========================
   PRODUCTS
========================= */

.products{
    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(280px,1fr)
        );

    gap:16px;
}

.product{
    background:#1b0e08;

    border:1px solid rgba(231,185,87,.15);

    border-radius:18px;

    overflow:hidden;
}

.product-image{
    height:180px;

    background:#100604;
}

.product-image img{
    width:100%;
    height:100%;

    object-fit:cover;

    display:block;
}

.product-body{
    padding:15px;
}

.product-body h3{
    color:#ffe2a0;

    font-size:17px;

    margin-bottom:7px;
}

.info{
    color:#b7a797;

    font-size:13px;

    margin-bottom:4px;
}

.actions{
    display:flex;

    gap:8px;

    margin-top:14px;
}

.edit,
.delete{
    flex:1;

    padding:10px;

    border-radius:10px;

    cursor:pointer;

    font-family:inherit;

    font-weight:800;
}

.edit{
    background:#261509;

    color:#ffe2a0;

    border:1px solid rgba(231,185,87,.3);
}

.delete{
    background:#2a0d0a;

    color:#ef9a8f;

    border:1px solid rgba(224,125,114,.25);
}


/* =========================
   FORM MODAL
========================= */

.modal{
    position:fixed;

    inset:0;

    background:rgba(0,0,0,.88);

    display:none;

    align-items:center;

    justify-content:center;

    padding:20px;

    z-index:100;
}

.modal.active{
    display:flex;
}

.modal-box{
    width:min(500px,100%);

    max-height:90vh;

    overflow:auto;

    background:#1b0e08;

    border:1px solid rgba(231,185,87,.28);

    border-radius:22px;

    padding:23px;
}

.modal-box h2{
    color:#ffe2a0;

    margin-bottom:18px;
}

.group{
    margin-bottom:13px;
}

.group label{
    display:block;

    color:#bcae9e;

    font-size:12px;

    margin-bottom:5px;
}

.group input,
.group select{
    width:100%;

    padding:12px;

    border-radius:11px;

    border:1px solid rgba(255,255,255,.1);

    background:#100704;

    color:white;

    outline:none;

    font-family:inherit;
}

.group select option{
    background:#160a06;
}

.modal-actions{
    display:flex;

    gap:10px;

    margin-top:18px;
}

.save{
    flex:1;

    padding:12px;

    border:0;

    border-radius:11px;

    background:
        linear-gradient(
            135deg,
            #f2d27c,
            #b97d25
        );

    color:#211205;

    font-family:inherit;

    font-weight:900;

    cursor:pointer;
}

.cancel{
    flex:1;

    padding:12px;

    border-radius:11px;

    border:1px solid rgba(255,255,255,.15);

    background:#160a06;

    color:white;

    font-family:inherit;

    cursor:pointer;
}

.empty{
    text-align:center;

    color:#998979;

    padding:40px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    header{
        padding:0 4%;
    }

    header h1{
        font-size:16px;
    }

    .container{
        width:94%;
    }

    .products{
        grid-template-columns:1fr;
    }

}

</style>
</head>

<body>


<!-- =========================
     LOGIN
========================= -->

<section
    class="login-screen"
    id="loginScreen"
>

    <div class="login-box">

        <div class="logo">
            H
        </div>

        <h1>
            هريسة الحلبي
        </h1>

        <p>
            لوحة تحكم مدير الفروع
        </p>

        <input
            class="input"
            id="password"
            type="password"
            placeholder="اكتب كلمة المرور"
            onkeydown="if(event.key==='Enter') login()"
        >

        <button
            class="btn"
            onclick="login()"
        >
            دخول لوحة التحكم
        </button>

        <div
            class="error"
            id="loginError"
        ></div>

    </div>

</section>


<!-- =========================
     ADMIN
========================= -->

<section
    class="admin"
    id="adminPanel"
>

    <header>

        <h1>
            ⚙️ لوحة تحكم الحلبي
        </h1>

        <button
            class="logout"
            onclick="logout()"
        >
            تسجيل الخروج
        </button>

    </header>


    <main class="container">

        <div class="top">

            <h2>
                المنتجات
            </h2>

            <button
                class="add-btn"
                onclick="openAddProduct()"
            >
                + إضافة صنف
            </button>

        </div>


        <div
            class="products"
            id="productsList"
        ></div>

    </main>

</section>


<!-- =========================
     PRODUCT MODAL
========================= -->

<div
    class="modal"
    id="productModal"
>

    <div class="modal-box">

        <h2 id="modalTitle">
            إضافة صنف
        </h2>


        <div class="group">

            <label>
                اسم الصنف
            </label>

            <input
                id="productName"
                type="text"
                placeholder="مثال: هريسة سادة"
            >

        </div>


        <div class="group">

            <label>
                السعر
            </label>

            <input
                id="productPrice"
                type="number"
                min="0"
                placeholder="180"
            >

        </div>


        <div class="group">

            <label>
                رابط / مسار الصورة
            </label>

            <input
                id="productImage"
                type="text"
                placeholder="images/1.jpg"
            >

        </div>


        <div class="group">

            <label>
                القسم
            </label>

            <select id="productCategory">

                <option>
                    الهريسة
                </option>

                <option>
                    الكنافة
                </option>

                <option>
                    الحلويات الشرقية
                </option>

                <option>
                    البقلاوة
                </option>

                <option>
                    المخبوزات
                </option>

                <option>
                    البسكويت
                </option>

                <option>
                    الحلويات الغربية
                </option>

            </select>

        </div>


        <div class="group">

            <label>
                طريقة البيع
            </label>

            <select id="productWeighted">

                <option value="true">
                    بالكيلو
                </option>

                <option value="false">
                    بالقطعة
                </option>

            </select>

        </div>


        <div class="modal-actions">

            <button
                class="save"
                onclick="saveProduct()"
            >
                حفظ
            </button>

            <button
                class="cancel"
                onclick="closeProductModal()"
            >
                إلغاء
            </button>

        </div>

    </div>

</div>


<script>

/*
=====================================================
  مؤقتًا للتجربة فقط
=====================================================

  كلمة المرور التجريبية:
  123456

  هنغيرها بعد ما نوصل لوحة التحكم
  بالـ API بشكل آمن.
=====================================================
*/


const ADMIN_PASSWORD = "123456";


let products = [];
    fetch("/api/products")
  .then(response => response.json())
  .then(data => {
    products = data;
    renderProducts();
  })
  .catch(error => {
    console.error("Error loading products:", error);
  });


let editingId = null;


/* =========================
   LOGIN
========================= */

function login(){

    const password =
        document
        .getElementById("password")
        .value;

    const error =
        document
        .getElementById("loginError");


    if(password === ADMIN_PASSWORD){

        document
            .getElementById("loginScreen")
            .style.display = "none";

        document
            .getElementById("adminPanel")
            .style.display = "block";

        sessionStorage.setItem(
            "halabyAdmin",
            "1"
        );

        renderAdminProducts();

    }else{

        error.textContent =
            "كلمة المرور غير صحيحة";

    }

}


function logout(){

    sessionStorage.removeItem(
        "halabyAdmin"
    );

    location.reload();

}


/* =========================
   AUTO LOGIN
========================= */

if(
    sessionStorage.getItem(
        "halabyAdmin"
    ) === "1"
){

    document
        .getElementById("loginScreen")
        .style.display = "none";

    document
        .getElementById("adminPanel")
        .style.display = "block";

    renderAdminProducts();

}


/* =========================
   RENDER
========================= */

function renderAdminProducts(){

    const box =
        document.getElementById(
            "productsList"
        );


    box.innerHTML = "";


    if(!products.length){

        box.innerHTML =
            `<div class="empty">
                مفيش منتجات حاليًا
            </div>`;

        return;

    }


    products.forEach(product => {

        const card =
            document.createElement("div");


        card.className =
            "product";


        card.innerHTML = `

            <div class="product-image">

                <img
                    src="${product.image}"
                    alt="${product.name}"
                    onerror="this.style.opacity='.2'"
                >

            </div>


            <div class="product-body">

                <h3>
                    ${product.name}
                </h3>

                <div class="info">
                    السعر:
                    ${product.price}
                    جنيه
                    ${product.weighted ? "/ كيلو" : "/ قطعة"}
                </div>

                <div class="info">
                    القسم:
                    ${product.category}
                </div>

                <div class="actions">

                    <button
                        class="edit"
                        onclick="editProduct(${product.id})"
                    >
                        تعديل
                    </button>

                    <button
                        class="delete"
                        onclick="deleteProduct(${product.id})"
                    >
                        حذف
                    </button>

                </div>

            </div>

        `;


        box.appendChild(card);

    });

}


/* =========================
   ADD
========================= */

function openAddProduct(){

    editingId = null;


    document
        .getElementById("modalTitle")
        .textContent =
            "إضافة صنف";


    document
        .getElementById("productName")
        .value = "";


    document
        .getElementById("productPrice")
        .value = "";


    document
        .getElementById("productImage")
        .value = "";


    document
        .getElementById("productCategory")
        .value =
            "الهريسة";


    document
        .getElementById("productWeighted")
        .value =
            "true";


    document
        .getElementById("productModal")
        .classList.add("active");

}


/* =========================
   EDIT
========================= */

function editProduct(id){

    const product =
        products.find(
            p => p.id === id
        );


    if(!product)
        return;


    editingId = id;


    document
        .getElementById("modalTitle")
        .textContent =
            "تعديل الصنف";


    document
        .getElementById("productName")
        .value =
            product.name;


    document
        .getElementById("productPrice")
        .value =
            product.price;


    document
        .getElementById("productImage")
        .value =
            product.image;


    document
        .getElementById("productCategory")
        .value =
            product.category;


    document
        .getElementById("productWeighted")
        .value =
            String(product.weighted);


    document
        .getElementById("productModal")
        .classList.add("active");

}


/* =========================
   SAVE
========================= */

function saveProduct(){

    const name =
        document
        .getElementById("productName")
        .value
        .trim();


    const price =
        Number(
            document
            .getElementById("productPrice")
            .value
        );


    const image =
        document
        .getElementById("productImage")
        .value
        .trim();


    const category =
        document
        .getElementById("productCategory")
        .value;


    const weighted =
        document
        .getElementById("productWeighted")
        .value === "true";


    if(!name || !price || !image){

        alert(
            "اكتب اسم الصنف والسعر والصورة"
        );

        return;

    }


    if(editingId !== null){

        const product =
            products.find(
                p => p.id === editingId
            );


        if(product){

            product.name =
                name;

            product.price =
                price;

            product.image =
                image;

            product.category =
                category;

            product.weighted =
                weighted;

        }

    }else{

        const newId =
            products.length
            ? Math.max(
                ...products.map(
                    p => p.id
                )
            ) + 1
            : 1;


        products.push({

            id:newId,

            name:name,

            price:price,

            image:image,

            category:category,

            weighted:weighted

        });

    }


    renderAdminProducts();

    closeProductModal();

    alert(
        "تم الحفظ داخل لوحة التحكم"
    );

}


/* =========================
   DELETE
========================= */

function deleteProduct(id){

    const product =
        products.find(
            p => p.id === id
        );


    if(!product)
        return;


    const ok =
        confirm(
            `تحب تحذف "${product.name}"؟`
        );


    if(!ok)
        return;


    products =
        products.filter(
            p => p.id !== id
        );


    renderAdminProducts();

}


/* =========================
   CLOSE
========================= */

function closeProductModal(){

    document
        .getElementById("productModal")
        .classList.remove("active");

}


document
    .getElementById("productModal")
    .addEventListener(
        "click",
        function(e){

            if(e.target === this){

                closeProductModal();

            }

        }
    );

</script>

</body>
</html>
